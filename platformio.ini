[env:esp32doit-devkit-v1]
platform      = espressif32@6.13.0
board         = esp32doit-devkit-v1
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = 
	time
	log2file
lib_deps      = 
    https://github.com/Rubix-Battery/esp_log_alias.git#1.0.0
    ; https://github.com/Giddy-Up224/ard-timer.git#v1.0.0
    https://github.com/coryjfowler/MCP_CAN_lib.git#1.5.1
    esphome/AsyncTCP-esphome@^2.0.0
    esphome/ESPAsyncWebServer-esphome@^3.0.0
    ArduinoJSON@6.19.4
board_build.partitions = storage_4MB_noota.csv
build_flags =
    ; Change this log level to whatever your logging needs are
    ; Additional logging flags/options available. See esp32-hal-log.h for full list.
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_NONE
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; define pins for CAN adapter
    -DCAN_SO=19
    -DCAN_SI=23
    -DCAN_SCK=18
    -DCAN_CS=5
    -DCAN_INT=4